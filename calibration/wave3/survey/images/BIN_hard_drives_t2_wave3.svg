<svg xmlns="http://www.w3.org/2000/svg" width="612" height="272" font-family="Arial,sans-serif">
<rect width="612" height="272" fill="white"/>
<text x="16" y="20" font-size="14" font-weight="bold">External hard drives</text>
<text x="16" y="56" font-size="12" font-weight="bold">Option A</text>
<text x="16" y="69" font-size="9" fill="#333">DataPort External</text>
<text x="16" y="80" font-size="9" fill="#333">Drive</text>
<text x="166" y="50" font-size="9" fill="#555">storage</text>
<rect x="166" y="54" width="150" height="13" fill="#eee" stroke="#999"/><rect x="166" y="54" width="43.5" height="13" fill="#3b7a57"/>
<text x="166" y="80" font-size="8.5" font-style="italic" fill="#666">space for large photo and document</text>
<text x="166" y="91" font-size="8.5" font-style="italic" fill="#666">libraries</text>
<text x="381" y="50" font-size="9" fill="#555">price</text>
<rect x="381" y="54" width="150" height="13" fill="#eee" stroke="#999"/><rect x="381" y="54" width="49.3" height="13" fill="#d9822b"/>
<text x="381" y="80" font-size="8.5" font-style="italic" fill="#666">a value price</text>
<text x="16" y="152" font-size="12" font-weight="bold">Option B</text>
<text x="16" y="165" font-size="9" fill="#333">VaultMax External</text>
<text x="16" y="176" font-size="9" fill="#333">Drive</text>
<text x="166" y="146" font-size="9" fill="#555">storage</text>
<rect x="166" y="150" width="150" height="13" fill="#eee" stroke="#999"/><rect x="166" y="150" width="130.4" height="13" fill="#3b7a57"/>
<text x="166" y="176" font-size="8.5" font-style="italic" fill="#666">room for full-system backups and years</text>
<text x="166" y="187" font-size="8.5" font-style="italic" fill="#666">of media</text>
<text x="381" y="146" font-size="9" fill="#555">price</text>
<rect x="381" y="150" width="150" height="13" fill="#eee" stroke="#999"/><rect x="381" y="150" width="130.4" height="13" fill="#d9822b"/>
<text x="381" y="176" font-size="8.5" font-style="italic" fill="#666">a step-up price</text>
<text x="16" y="265" font-size="9" fill="#555">Each bar shows the amount (no numbers). Longer green bar = more storage (better); longer amber bar = higher price (more expensive).</text>
