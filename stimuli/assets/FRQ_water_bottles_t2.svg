<svg xmlns="http://www.w3.org/2000/svg" width="612" height="368" font-family="Arial,sans-serif">
<rect width="612" height="368" fill="white"/>
<text x="16" y="20" font-size="14" font-weight="bold">Water bottles</text>
<text x="16" y="56" font-size="12" font-weight="bold">Option A</text>
<text x="16" y="69" font-size="9" fill="#333">AquaPod Water Bottle</text>
<text x="166" y="50" font-size="9" fill="#555">capacity</text>
<rect x="166" y="54" width="150" height="13" fill="#eee" stroke="#999"/><rect x="166" y="54" width="43.5" height="13" fill="#3b7a57"/>
<text x="166" y="80" font-size="8.5" font-style="italic" fill="#666">right for a workout or a short commute</text>
<text x="381" y="50" font-size="9" fill="#555">price</text>
<rect x="381" y="54" width="150" height="13" fill="#eee" stroke="#999"/><rect x="381" y="54" width="46.9" height="13" fill="#d9822b"/>
<text x="381" y="80" font-size="8.5" font-style="italic" fill="#666">an impulse-buy price</text>
<text x="16" y="152" font-size="12" font-weight="bold">Option B</text>
<text x="16" y="165" font-size="9" fill="#333">HydraTank Water Bottle</text>
<text x="166" y="146" font-size="9" fill="#555">capacity</text>
<rect x="166" y="150" width="150" height="13" fill="#eee" stroke="#999"/><rect x="166" y="150" width="130.4" height="13" fill="#3b7a57"/>
<text x="166" y="176" font-size="8.5" font-style="italic" fill="#666">enough to skip refills most of the day</text>
<text x="381" y="146" font-size="9" fill="#555">price</text>
<rect x="381" y="150" width="150" height="13" fill="#eee" stroke="#999"/><rect x="381" y="150" width="130.4" height="13" fill="#d9822b"/>
<text x="381" y="176" font-size="8.5" font-style="italic" fill="#666">a mid-shelf price</text>
<text x="16" y="248" font-size="12" font-weight="bold">Option C</text>
<text x="16" y="261" font-size="9" fill="#333">SipMate Water Bottle</text>
<text x="166" y="242" font-size="9" fill="#555">capacity</text>
<rect x="166" y="246" width="150" height="13" fill="#eee" stroke="#999"/><rect x="166" y="246" width="21.7" height="13" fill="#3b7a57"/>
<text x="166" y="272" font-size="8.5" font-style="italic" fill="#666">runs small for a full workout</text>
<text x="381" y="242" font-size="9" fill="#555">price</text>
<rect x="381" y="246" width="150" height="13" fill="#eee" stroke="#999"/><rect x="381" y="246" width="58.7" height="13" fill="#d9822b"/>
<text x="381" y="272" font-size="8.5" font-style="italic" fill="#666">a low price for the shelf</text>
<text x="16" y="361" font-size="9" fill="#555">Each bar shows the amount (no numbers). Longer green bar = more capacity (better); longer amber bar = higher price (more expensive).</text>
</svg>