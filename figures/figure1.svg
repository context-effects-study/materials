<rect x="40" y="33" width="68.6807" height="20" rx="10" fill="rgba(100, 116, 139, 0.06)" stroke="rgba(100, 116, 139, 0.35)"/>
<text x="49" y="47.5" font-size="13" font-weight="700" letter-spacing="0.8" fill="#64748b">INPUTS</text>
<rect x="40" y="74" width="207.533" height="20" rx="10" fill="rgba(14, 116, 144, 0.06)" stroke="rgba(14, 116, 144, 0.35)"/>
<text x="49" y="88.5" font-size="13" font-weight="700" letter-spacing="0.8" fill="#0e7490">STEP 0 · VALIDITY CRITERIA</text>
<rect x="445" y="158" width="232.955" height="20" rx="10" fill="rgba(15, 118, 110, 0.06)" stroke="rgba(15, 118, 110, 0.35)"/>
<text x="454" y="172.5" font-size="13" font-weight="700" letter-spacing="0.8" fill="#0f766e">STEP 1 · HUMAN BENCHMARKS</text>
<rect x="40" y="256" width="203.921" height="20" rx="10" fill="rgba(42, 120, 214, 0.06)" stroke="rgba(42, 120, 214, 0.35)"/>
<text x="49" y="270.5" font-size="13" font-weight="700" letter-spacing="0.8" fill="#2a78d6">STEP 2 · THE FIDELITY MAP</text>
<rect x="257.921" y="256" width="140.468" height="20" rx="10" fill="rgba(42, 120, 214, 0.06)" stroke="rgba(42, 120, 214, 0.35)"/>
<text x="266.921" y="270.5" font-size="13" font-weight="700" letter-spacing="0.8" fill="#2a78d6">FIDELITY CLASSES</text>
<rect x="40" y="448" width="231.655" height="20" rx="10" fill="rgba(124, 58, 237, 0.06)" stroke="rgba(124, 58, 237, 0.35)"/>
<text x="49" y="462.5" font-size="13" font-weight="700" letter-spacing="0.8" fill="#7c3aed">STEP 3 · WHERE FIDELITY FAILS</text>
<rect x="138" y="586" width="144.467" height="20" rx="10" fill="rgba(180, 83, 9, 0.06)" stroke="rgba(180, 83, 9, 0.35)"/>
<text x="147" y="600.5" font-size="13" font-weight="700" letter-spacing="0.8" fill="#b45309">PRECEDENCE RULE</text>
<rect x="40" y="666" width="175.679" height="20" rx="10" fill="rgba(134, 25, 143, 0.06)" stroke="rgba(134, 25, 143, 0.35)"/>
<text x="49" y="680.5" font-size="13" font-weight="700" letter-spacing="0.8" fill="#86198f">THE SEVEN SCENARIOS</text>
<rect x="350" y="20" width="310" height="46" rx="9" fill="#ffffff" stroke="rgba(100, 116, 139, 0.55)" stroke-width="1.4"/>
<text x="363" y="38.75" font-size="15.5" font-weight="600" fill="#171717">Every scorable cell</text>
<text x="363" y="57.75" font-size="13" fill="#444444">model × effect × category × tier × format</text>
<rect x="175" y="100" width="310" height="48" rx="9" fill="#ffffff" stroke="rgba(14, 116, 144, 0.55)" stroke-width="1.4"/>
<text x="188" y="119.75" font-size="15.5" font-weight="600" fill="#171717">The human replication criterion</text>
<text x="188" y="138.75" font-size="13" fill="#444444">replicated in our calibrated human sample?</text>
<rect x="525" y="100" width="310" height="48" rx="9" fill="#ffffff" stroke="rgba(14, 116, 144, 0.55)" stroke-width="1.4"/>
<text x="538" y="119.75" font-size="15.5" font-weight="600" fill="#171717">The model data-quality criterion</text>
<text x="538" y="138.75" font-size="13" fill="#444444">parse ≥ 95% · refusals ≤ 5% · the ceiling rule</text>
<rect x="33" y="184" width="265" height="62" rx="9" fill="#ffffff" stroke="rgba(143, 143, 143, 0.55)" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="46" y="203" font-size="15.5" font-weight="600" fill="#171717">Effect not replicated in humans</text>
<text x="46" y="222" font-size="13" fill="#444444">human result reported; model</text>
<text x="46" y="237.5" font-size="13" fill="#444444">effects there reported apart</text>
<rect x="350" y="184" width="310" height="62" rx="9" fill="#ffffff" stroke="rgba(15, 118, 110, 0.55)" stroke-width="1.4"/>
<text x="363" y="203" font-size="15.5" font-weight="600" fill="#171717">Human benchmarks</text>
<text x="363" y="222" font-size="13" fill="#444444">effect size + interval per cell</text>
<text x="363" y="237.5" font-size="13" fill="#444444">first-trial fallback</text>
<rect x="715" y="184" width="265" height="62" rx="9" fill="#ffffff" stroke="rgba(143, 143, 143, 0.55)" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="728" y="210.75" font-size="15.5" font-weight="600" fill="#171717">Not assessable as a respondent</text>
<text x="728" y="229.75" font-size="13" fill="#444444">reported apart from the map</text>
<rect x="65" y="283" width="210" height="44" rx="9" fill="#ffffff" stroke="rgba(22, 101, 52, 0.55)" stroke-width="1.4"/>
<text x="78" y="300.75" font-size="15.5" font-weight="600" fill="#171717">HIGH</text>
<text x="78" y="319.75" font-size="13" fill="#444444">matches people</text>
<rect x="319" y="283" width="210" height="44" rx="9" fill="#ffffff" stroke="rgba(14, 116, 144, 0.55)" stroke-width="1.4"/>
<text x="332" y="300.75" font-size="15.5" font-weight="600" fill="#171717">OVER</text>
<text x="332" y="319.75" font-size="13" fill="#444444">overshoots people</text>
<rect x="65" y="339" width="210" height="44" rx="9" fill="#ffffff" stroke="rgba(189, 128, 4, 0.55)" stroke-width="1.4"/>
<text x="78" y="356.75" font-size="15.5" font-weight="600" fill="#171717">PARTIAL</text>
<text x="78" y="375.75" font-size="13" fill="#444444">direction, not size</text>
<rect x="319" y="339" width="210" height="44" rx="9" fill="#ffffff" stroke="rgba(100, 116, 139, 0.55)" stroke-width="1.4"/>
<text x="332" y="356.75" font-size="15.5" font-weight="600" fill="#171717">LOW</text>
<text x="332" y="375.75" font-size="13" fill="#444444">does not track context</text>
<rect x="65" y="395" width="210" height="44" rx="9" fill="#ffffff" stroke="rgba(190, 18, 60, 0.55)" stroke-width="1.4"/>
<text x="78" y="412.75" font-size="15.5" font-weight="600" fill="#171717">ANTI</text>
<text x="78" y="431.75" font-size="13" fill="#444444">systematically reversed</text>
<rect x="575" y="282" width="320" height="62" rx="9" fill="rgba(42, 120, 214, 0.07)" stroke="rgba(42, 120, 214, 0.75)" stroke-width="2.4"/>
<text x="588" y="300.25" font-size="13" font-weight="700" letter-spacing="1.1" fill="#2a78d6">THE STUDY'S MAIN RESULT</text>
<text x="588" y="317.25" font-size="15.5" font-weight="600" fill="#171717">The fidelity map</text>
<text x="588" y="336.25" font-size="13" fill="#444444">model vs human effect size, every scorable cell</text>
<rect x="625" y="358" width="220" height="58" rx="9" fill="#ffffff" stroke="rgba(42, 120, 214, 0.55)" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="638" y="375" font-size="15.5" font-weight="600" fill="#171717">Similarity, scored apart</text>
<text x="638" y="394" font-size="13" fill="#444444">heterogeneity diagnostic,</text>
<text x="638" y="409.5" font-size="13" fill="#444444">never pooled</text>
<rect x="33" y="490" width="182" height="78" rx="9" fill="#ffffff" stroke="rgba(124, 58, 237, 0.55)" stroke-width="1.4"/>
<text x="46" y="515.25" font-size="15.5" font-weight="600" fill="#171717">T1 · Memorization</text>
<text x="46" y="534.25" font-size="15.5" font-weight="600" fill="#171717">gradient</text>
<text x="46" y="553.25" font-size="13" fill="#444444">the retrieval account</text>
<rect x="224" y="490" width="182" height="78" rx="9" fill="#ffffff" stroke="rgba(124, 58, 237, 0.55)" stroke-width="1.4"/>
<text x="237" y="515.25" font-size="15.5" font-weight="600" fill="#171717">T2 · Knows-it vs</text>
<text x="237" y="534.25" font-size="15.5" font-weight="600" fill="#171717">shows-it</text>
<text x="237" y="553.25" font-size="13" fill="#444444">rational override</text>
<rect x="415" y="490" width="182" height="78" rx="9" fill="#ffffff" stroke="rgba(124, 58, 237, 0.55)" stroke-width="1.4"/>
<text x="428" y="515.25" font-size="15.5" font-weight="600" fill="#171717">T3 · Argument-</text>
<text x="428" y="534.25" font-size="15.5" font-weight="600" fill="#171717">strength ladder</text>
<text x="428" y="553.25" font-size="13" fill="#444444">reason construction</text>
<rect x="606" y="490" width="182" height="78" rx="9" fill="#ffffff" stroke="rgba(124, 58, 237, 0.55)" stroke-width="1.4"/>
<text x="619" y="517" font-size="15.5" font-weight="600" fill="#171717">T4 · Format</text>
<text x="619" y="536" font-size="13" fill="#444444">reason construction</text>
<text x="619" y="551.5" font-size="13" fill="#444444">(descriptive)</text>
<rect x="797" y="490" width="182" height="78" rx="9" fill="#ffffff" stroke="rgba(124, 58, 237, 0.55)" stroke-width="1.4"/>
<text x="810" y="517" font-size="15.5" font-weight="600" fill="#171717">T5 · Trajectory</text>
<text x="810" y="536" font-size="13" fill="#444444">generations,</text>
<text x="810" y="551.5" font-size="13" fill="#444444">reasoning on/off</text>
<rect x="325" y="612" width="360" height="46" rx="9" fill="#ffffff" stroke="rgba(180, 83, 9, 0.55)" stroke-width="1.4"/>
<text x="338" y="630.75" font-size="15.5" font-weight="600" fill="#171717">The precedence rule</text>
<text x="338" y="649.75" font-size="13" fill="#444444">two registered overrides resolve overlaps</text>
<rect x="45" y="708" width="218" height="34" rx="9" fill="#ffffff" stroke="rgba(134, 25, 143, 0.55)" stroke-width="1.4"/>
<text x="58" y="728.5" font-size="15.5" font-weight="600" fill="#171717">S1 · High fidelity</text>
<rect x="279" y="708" width="218" height="34" rx="9" fill="#ffffff" stroke="rgba(134, 25, 143, 0.55)" stroke-width="1.4"/>
<text x="292" y="728.5" font-size="15.5" font-weight="600" fill="#171717">S2 · Retrieval only</text>
<rect x="513" y="708" width="218" height="34" rx="9" fill="#ffffff" stroke="rgba(134, 25, 143, 0.55)" stroke-width="1.4"/>
<text x="526" y="728.5" font-size="15.5" font-weight="600" fill="#171717">S3 · Reason construction</text>
<rect x="747" y="708" width="218" height="34" rx="9" fill="#ffffff" stroke="rgba(134, 25, 143, 0.55)" stroke-width="1.4"/>
<text x="760" y="728.5" font-size="15.5" font-weight="600" fill="#171717">S4 · Rational override</text>
<rect x="45" y="764" width="218" height="34" rx="9" fill="#ffffff" stroke="rgba(134, 25, 143, 0.55)" stroke-width="1.4"/>
<text x="58" y="784.5" font-size="15.5" font-weight="600" fill="#171717">S5 · Family-specific</text>
<rect x="279" y="764" width="218" height="34" rx="9" fill="#ffffff" stroke="rgba(134, 25, 143, 0.55)" stroke-width="1.4"/>
<text x="292" y="784.5" font-size="15.5" font-weight="600" fill="#171717">S6 · Rising fidelity</text>
<rect x="513" y="764" width="218" height="34" rx="9" fill="#ffffff" stroke="rgba(134, 25, 143, 0.55)" stroke-width="1.4"/>
<text x="526" y="784.5" font-size="15.5" font-weight="600" fill="#171717">S7 · Human effects fail</text>
<rect x="747" y="764" width="218" height="34" rx="9" fill="#ffffff" stroke="rgba(134, 25, 143, 0.55)" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="760" y="784.5" font-size="15.5" font-weight="600" fill="#171717">No scenario matched</text>
<line x1="30" y1="816" x2="48" y2="816" stroke="#7C8AA5" stroke-width="2.4"/>
<text x="54" y="820" font-size="13" fill="#4d4d4d">advances</text>
