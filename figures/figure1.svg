<text x="156.787109375" y="820" font-size="13" fill="#4d4d4d">criterion not met</text>
<line x1="279.2080078125" y1="816" x2="297.2080078125" y2="816" stroke="#2a78d6" stroke-width="2.4"/>
<text x="303.2080078125" y="820" font-size="13" fill="#4d4d4d">sorted into a class</text>
<line x1="432.3447265625" y1="816" x2="450.3447265625" y2="816" stroke="#7c3aed" stroke-width="2.4"/>
<text x="456.3447265625" y="820" font-size="13" fill="#4d4d4d">feeds a pattern test</text>
<line x1="30" y1="835" x2="48" y2="835" stroke="#b45309" stroke-width="2.4"/>
<text x="54" y="839" font-size="13" fill="#4d4d4d">override (registered)</text>
<line x1="196.5048828125" y1="835" x2="214.5048828125" y2="835" stroke="#86198f" stroke-width="2.4"/>
<text x="220.5048828125" y="839" font-size="13" fill="#4d4d4d">routes to a scenario</text>
